<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag to compare</title>
<style>
:root { --x: 50%; --base: #0c1015; --panel: #151b23; --edge: #303c49; --text: #edf2f7; --muted: #94a3b2; --accent: #a7ddeb; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--base); color: var(--text); font: 14px/1.35 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; }
header span { color: var(--muted); font-size: 12px; }
main { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
.stage { position: relative; width: min(100%, 380px); height: 190px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px var(--edge); cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; }

/* Both sides are the same real page, with and without the fix. */
.shop { position: absolute; inset: 0; background: #fbfaf7; color: #22252a; pointer-events: none; }
.shop.after { clip-path: inset(0 0 0 var(--x)); }
.shop-name { padding: 7px 12px 5px; font-size: 12px; font-weight: 700; color: #5c6168; }
.row { display: flex; justify-content: space-between; padding: 5px 12px; border-top: 1px solid #ece9e2; font-size: 13px; }
.row.total { font-weight: 700; }
.pay { position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: #2f6f4f; color: #fff; font-weight: 700; }
.cookie { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 12px; background: #3c4148; color: #f0f1f3; font-size: 13px; }
.after .pay { left: 0; right: 0; bottom: 0; height: 50px; border-radius: 0; }
.after .cookie { bottom: 50px; height: 26px; font-size: 12px; }
.line { position: absolute; top: 0; bottom: 0; left: var(--x); width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; }
.line::after { content: ''; position: absolute; top: 50%; left: 50%; width: 34px; height: 24px; margin: -12px 0 0 -17px; border: 2px solid var(--accent); border-radius: 12px; background: var(--base) linear-gradient(90deg, transparent 47%, var(--accent) 47% 53%, transparent 53%); }
.stage:has(input:focus-visible) .line::after { outline: 2px solid #1b6f8a; outline-offset: 2px; }
.range { position: absolute; width: 1px; height: 1px; opacity: 0; }
footer { display: flex; gap: 8px; }
button { flex: 1; min-height: 44px; border: 1px solid var(--edge); border-radius: 8px; background: var(--panel); color: var(--text); font: 600 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
button.primary { border-color: var(--accent); background: var(--accent); color: var(--base); }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<header><h1>Drag to compare</h1><span>Before ← drag → After</span></header>
<main>
  <div class="stage" id="stage">
    <div class="shop before">
      <div class="shop-name">Fern Coffee · Checkout</div>
      <div class="row"><span>Morning Blend × 2</span><span>$24.00</span></div>
      <div class="row"><span>Shipping</span><span>$4.00</span></div>
      <div class="row total"><span>Total</span><span>$28.00</span></div>
      <div class="pay">Pay $28.00</div>
      <div class="cookie"><span>We use cookies</span><span>OK</span></div>
    </div>
    <div class="shop after">
      <div class="shop-name">Fern Coffee · Checkout</div>
      <div class="row"><span>Morning Blend × 2</span><span>$24.00</span></div>
      <div class="row"><span>Shipping</span><span>$4.00</span></div>
      <div class="row total"><span>Total</span><span>$28.00</span></div>
      <div class="pay">Pay $28.00</div>
      <div class="cookie"><span>We use cookies</span><span>OK</span></div>
    </div>
    <div class="line"></div>
    <input class="range" id="range" type="range" min="0" max="100" value="50" aria-label="Compare before and after">
  </div>
</main>
<footer>
  <button id="back" type="button">Go back</button>
  <button id="keep" class="primary" type="button">Ship it</button>
</footer>
<script>
const stage = document.getElementById('stage');
const range = document.getElementById('range');
let touched = false;
const show = value => { range.value = value; document.documentElement.style.setProperty('--x', `${value}%`); };
const follow = event => {
  const box = stage.getBoundingClientRect();
  show(Math.round(Math.min(100, Math.max(0, (event.clientX - box.left) / box.width * 100))));
};
range.addEventListener('input', () => { touched = true; show(range.value); });
stage.addEventListener('pointerdown', event => { touched = true; stage.setPointerCapture(event.pointerId); follow(event); range.focus({ preventScroll: true }); });
// Without this the browser moves focus away right after pointerdown and the arrow keys stop working.
stage.addEventListener('mousedown', event => event.preventDefault());
stage.addEventListener('pointermove', event => { if (stage.hasPointerCapture(event.pointerId)) follow(event); });
for (const button of document.querySelectorAll('footer button')) {
  button.addEventListener('click', () => {
    parent.postMessage({ type: 'x-card-reply', text: `${button.textContent}.` }, '*');
    document.querySelector('header span').textContent = 'Added to your draft';
  });
}

// One small sweep tells people the card can be dragged, without a sentence.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const started = performance.now();
  const sweep = time => {
    if (touched) return;
    const progress = Math.min(1, (time - started - 500) / 1800);
    if (progress > 0) show(Math.round(50 + Math.sin(progress * Math.PI * 2) * 30));
    if (progress < 1) requestAnimationFrame(sweep);
  };
  requestAnimationFrame(sweep);
}
</script>
</body>
</html>
