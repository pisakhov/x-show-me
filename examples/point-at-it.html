<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point at it</title>
<style>
:root { --base: #0c1015; --panel: #151b23; --edge: #303c49; --text: #edf2f7; --soft: #b0bdc9; --muted: #94a3b2; --accent: #a7ddeb; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--base); color: var(--text); font: 14px/1.35 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; }
header span { color: var(--muted); font-size: 12px; }
main { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }

/* The sample page. It is a real render: real HTML, not a picture of one. */
.shop { position: relative; width: min(100%, 340px); overflow: hidden; border-radius: 12px; background: #fbfaf7; color: #22252a; cursor: crosshair; box-shadow: 0 0 0 1px var(--edge); }
.shop-name { padding: 5px 12px 3px; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #5c6168; }
.pair { display: grid; grid-template-columns: 1fr auto; }
.spot { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-top: 1px solid #ece9e2; background: none; color: inherit; font: inherit; cursor: crosshair; }
.spot.coupon { color: #6a7078; font-size: 13px; text-decoration: underline; }
.spot.total { font-weight: 700; }
.pay-wrap { height: 70px; padding: 6px 12px 0; }
.spot.pay { justify-content: center; align-items: flex-start; padding-top: 2px; border: 0; border-radius: 8px; background: #2f6f4f; color: #fff; font-size: 13px; font-weight: 700; }
.spot.cookie { position: absolute; left: 0; right: 0; bottom: 0; border: 0; background: #3c4148; color: #f0f1f3; font-size: 13px; z-index: 2; }
.spot:focus-visible { outline: 2px solid #1b6f8a; outline-offset: -2px; }
.spot[aria-pressed="true"] { outline: 3px solid #1b95ba; outline-offset: -3px; }
.pin { position: absolute; z-index: 3; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #fff; border-radius: 50%; background: #1b95ba; box-shadow: 0 0 0 2px #1b95ba, 0 3px 10px #0007; pointer-events: none; animation: drop .22s ease-out; }
@keyframes drop { from { transform: scale(2.2); opacity: 0; } }

footer { display: flex; align-items: center; gap: 10px; min-height: 44px; }
#said { flex: 1; min-width: 0; margin: 0; color: var(--soft); font-size: 13px; }
#said b { color: var(--text); }
#send { flex: none; min-height: 44px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--base); font: 600 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
#send:disabled { border-color: var(--edge); background: var(--panel); color: var(--muted); cursor: default; }
#send:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .pin { animation: none; } }
</style>
</head>
<body>
<header><h1>Point at it</h1><span>Tap the thing you mean</span></header>
<main>
  <div class="shop" id="shop">
    <div class="shop-name">Fern Coffee · Checkout</div>
    <button class="spot" type="button" data-name="Order line" data-note="Morning Blend × 2"><span>Morning Blend × 2</span><span>$24.00</span></button>
    <div class="pair">
      <button class="spot total" type="button" data-name="Total" data-note="$28.00 with shipping"><span>Total</span><span>$28.00</span></button>
      <button class="spot coupon" type="button" data-name="Apply coupon link" data-note="small link next to the total">Apply coupon</button>
    </div>
    <div class="pay-wrap"><button class="spot pay" type="button" data-name="Pay button" data-note="hidden behind the cookie bar">Pay $28.00</button></div>
    <button class="spot cookie" type="button" data-name="Cookie bar" data-note="sits on top of the Pay button"><span>We use cookies</span><span>OK</span></button>
  </div>
</main>
<footer>
  <p id="said" aria-live="polite">Nothing picked yet.</p>
  <button id="send" type="button" disabled>Fix this</button>
</footer>
<script>
const shop = document.getElementById('shop');
const said = document.getElementById('said');
const send = document.getElementById('send');
let picked = null;

function placePin(x, y) {
  shop.querySelector('.pin')?.remove();
  const pin = document.createElement('span');
  pin.className = 'pin';
  pin.style.left = `${x}px`;
  pin.style.top = `${y}px`;
  shop.append(pin);
}

for (const spot of shop.querySelectorAll('.spot')) {
  spot.addEventListener('click', event => {
    for (const other of shop.querySelectorAll('.spot')) other.setAttribute('aria-pressed', String(other === spot));
    picked = spot;
    const page = shop.getBoundingClientRect();
    const box = spot.getBoundingClientRect();
    const fromPointer = event.detail > 0;
    placePin((fromPointer ? event.clientX : box.left + box.width / 2) - page.left, (fromPointer ? event.clientY : box.top + box.height / 2) - page.top);
    said.replaceChildren(Object.assign(document.createElement('b'), { textContent: spot.dataset.name }), `: ${spot.dataset.note}`);
    send.disabled = false;
  });
}

send.addEventListener('click', () => {
  const text = `Fix this: ${picked.dataset.name} (${picked.dataset.note}).`;
  parent.postMessage({ type: 'x-card-reply', text }, '*');
  said.textContent = 'Added to your draft. You still press send.';
});
</script>
</body>
</html>
