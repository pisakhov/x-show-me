<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap to decide</title>
<style>
:root { --base: #0c1015; --panel: #151b23; --raised: #1b242e; --edge: #303c49; --text: #edf2f7; --soft: #b0bdc9; --muted: #94a3b2; --accent: #a7ddeb; --ok: #93dfb3; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--base); color: var(--text); font: 13px/1.3 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; }
header span { color: var(--muted); font-size: 12px; }
.options { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: center; align-items: stretch; width: 100%; max-width: 660px; min-height: 0; margin: 0 auto; }
.option { display: flex; flex-direction: column; gap: 6px; width: 100%; min-height: 44px; padding: 6px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.option[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); box-shadow: 0 0 0 1px var(--accent); }
.option:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.option b { display: block; font-size: 13px; }
.option small { display: block; color: var(--soft); font-size: 12px; }
.option em { display: block; color: var(--ok); font-size: 11px; font-style: normal; font-weight: 600; height: 15px; }

/* Three real, tiny versions of the checkout page. */
.mini { position: relative; height: 104px; overflow: hidden; border-radius: 6px; background: #fbfaf7; }
.line { position: absolute; left: 10%; height: 6px; border-radius: 3px; background: #d9d5cb; }
.line.a { top: 12px; width: 50%; } .line.b { top: 25px; width: 72%; } .line.c { top: 38px; width: 60%; }
.pay { position: absolute; left: 10%; right: 10%; bottom: 8px; height: 22px; border-radius: 5px; background: #2f6f4f; }
.bar { position: absolute; left: 0; right: 0; height: 15px; background: #3c4148; }
.sticky .pay { left: 0; right: 0; bottom: 0; height: 28px; border-radius: 0; }
.sticky .bar { bottom: 28px; height: 11px; }
.top .bar { top: 0; } .top .line { transform: translateY(14px); }
.popup .bar { left: 14%; right: 14%; top: 30px; height: 36px; border-radius: 6px; box-shadow: 0 2px 8px #0005; }
footer { min-height: 20px; color: var(--soft); text-align: center; }
</style>
</head>
<body>
<header><h1>Tap to decide</h1><span>Pick one fix</span></header>
<div class="options" id="options">
  <button class="option" type="button" data-pick="Sticky Pay button">
    <span class="mini sticky"><i class="line a"></i><i class="line b"></i><i class="line c"></i><i class="bar"></i><i class="pay"></i></span>
    <span><em>Recommended</em><b>Sticky Pay button</b><small>Always in reach</small></span>
  </button>
  <button class="option" type="button" data-pick="Cookie bar on top">
    <span class="mini top"><i class="line a"></i><i class="line b"></i><i class="line c"></i><i class="bar"></i><i class="pay"></i></span>
    <span><em></em><b>Cookie bar on top</b><small>Smallest change</small></span>
  </button>
  <button class="option" type="button" data-pick="Cookie pop-up">
    <span class="mini popup"><i class="line a"></i><i class="line b"></i><i class="line c"></i><i class="pay"></i><i class="bar"></i></span>
    <span><em></em><b>Cookie pop-up</b><small>Blocks the page once</small></span>
  </button>
</div>
<footer id="said" aria-live="polite">One tap is the whole answer.</footer>
<script>
const options = [...document.querySelectorAll('.option')];
for (const option of options) {
  option.addEventListener('click', () => {
    for (const other of options) other.setAttribute('aria-pressed', String(other === option));
    parent.postMessage({ type: 'x-card-reply', text: `Go with: ${option.dataset.pick}.` }, '*');
    document.getElementById('said').textContent = 'Added to your draft. You still press send.';
  });
}
</script>
</body>
</html>
