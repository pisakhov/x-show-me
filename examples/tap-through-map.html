<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap-through map</title>
<style>
:root { --base: #0c1015; --panel: #151b23; --raised: #1b242e; --edge: #303c49; --text: #edf2f7; --soft: #b0bdc9; --muted: #94a3b2; --accent: #a7ddeb; --ok: #93dfb3; --bad: #f87171; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; gap: 12px; padding: 10px 12px; background: var(--base); color: var(--text); font: 14px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; }
header span { color: var(--muted); font-size: 12px; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; width: 100%; max-width: 620px; min-height: 0; margin: 0 auto; }
ol { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
ol::before { content: ''; position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--edge); }
.node { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 100%; min-height: 66px; padding: 6px 2px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); color: var(--text); font: 600 13px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
.node i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.node[data-state="ok"] i { background: var(--ok); }
.node[data-state="broken"] i { background: var(--bad); box-shadow: 0 0 0 4px #f8717133; }
.node[data-state="broken"] { border-color: #f8717180; }
.node[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); box-shadow: 0 0 0 1px var(--accent); }
.node:focus-visible, #act:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.note { padding: 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
.note h2 { margin: 0 0 3px; font-size: 14px; }
.note p { margin: 0; color: var(--soft); }
#act { width: 100%; min-height: 44px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--base); font: 600 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
#act.quiet { background: var(--panel); color: var(--text); border-color: var(--edge); }
</style>
</head>
<body>
<header><h1>Tap-through map</h1><span>4 steps · 1 broken</span></header>
<div class="body">
  <ol id="flow"></ol>
  <section class="note" aria-live="polite"><h2 id="name"></h2><p id="text"></p></section>
  <button id="act" type="button"></button>
</div>
<script>
const STEPS = [
  { name: 'Cart', state: 'ok', text: 'Adds up the items and shipping. Works on every screen.' },
  { name: 'Address', state: 'ok', text: 'Saves where the coffee goes. Works on every screen.' },
  { name: 'Payment', state: 'broken', text: 'On phones the cookie bar covers the Pay button, so nobody can tap it.' },
  { name: 'Receipt', state: 'waiting', text: 'Confirms the order. Phone customers never get this far.' },
];
const flow = document.getElementById('flow');
const act = document.getElementById('act');
let current = 2;

function select(index) {
  current = index;
  const step = STEPS[index];
  for (const [i, node] of [...flow.querySelectorAll('.node')].entries()) node.setAttribute('aria-pressed', String(i === index));
  document.getElementById('name').textContent = step.name;
  document.getElementById('text').textContent = step.text;
  const broken = step.state === 'broken';
  act.textContent = broken ? 'Fix this step' : `Tell me more about ${step.name}`;
  act.classList.toggle('quiet', !broken);
}

STEPS.forEach((step, index) => {
  const item = document.createElement('li');
  const node = document.createElement('button');
  node.type = 'button';
  node.className = 'node';
  node.dataset.state = step.state;
  node.setAttribute('aria-label', `${step.name}: ${step.state}`);
  node.append(document.createElement('i'), step.name);
  node.addEventListener('click', () => select(index));
  item.append(node);
  flow.append(item);
});

act.addEventListener('click', () => {
  const step = STEPS[current];
  parent.postMessage({ type: 'x-card-reply', text: step.state === 'broken' ? `Fix the ${step.name} step.` : `Tell me more about the ${step.name} step.` }, '*');
  act.textContent = 'Added to your draft';
});
select(current);
</script>
</body>
</html>
